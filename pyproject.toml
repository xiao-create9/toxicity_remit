[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toxicity-remit"
version = "0.1.0"
description = "Reproducible infrastructure for endpoint-conditioned molecular toxicity explanations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "xiao-create9" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pyyaml>=6.0,<7",
  "rdkit>=2024.3,<2026.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
remit = "remit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/remit"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["remit"]
